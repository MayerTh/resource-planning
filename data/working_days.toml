# Static reference data: number of working days per month for Bavaria (Germany), 2026-2028.
# Generated once from public holiday data; not meant to be hand-edited regularly.
# "Working day" = Mon-Fri, excluding Bavarian statewide public holidays.
# Note: Mariae Himmelfahrt (Aug 15) is legally a holiday only in municipalities
# with a majority-Catholic population; it is treated here as non-working for the
# whole state. It only affects the count in 2028 (falls on a Tuesday); in 2026/2027
# it falls on a weekend anyway.
# See docs/adr/0003-calendar-reference-file.md and docs/adr/0005-working-days-counts-only.md.

